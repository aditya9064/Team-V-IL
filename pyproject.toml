[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-v-replay"
version = "0.1.0"
description = "Replay and evaluation foundation for verified robotic sorting"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
team-v-replay = "team_v.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
